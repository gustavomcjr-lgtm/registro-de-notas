<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Registradas - Nuvem Firebase</title>
    <!-- Importando o SDK do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --editable-bg: #fff9c4;
            --editable-border: #fbc02d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #statusNuvem {
            font-size: 13px;
            padding: 5px 10px;
            border-radius: 4px;
            background: #e2e8f0;
            color: #475569;
            display: inline-block;
            margin-bottom: 15px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .tab-btn {
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s, color 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .card {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid var(--secondary-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .card h3 {
            margin: 0;
            font-size: 15px;
            color: #64748b;
        }

        .card p {
            margin: 10px 0 0 0;
            font-size: 26px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            align-items: center;
        }

        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2563eb;
        }

        .btn-success { background-color: #10b981; }
        .btn-success:hover { background-color: #059669; }

        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }

        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-warning:hover { background-color: #d97706; }

        select, input[type="date"], input[type="text"], input[type="month"] {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input[type="text"] {
            min-width: 180px;
        }

        .report-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            max-width: 500px;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background: white;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 10px;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        [contenteditable="true"] {
            background-color: var(--editable-bg) !important;
            border: 1px dashed var(--editable-border) !important;
            padding: 6px 8px;
            border-radius: 4px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            display: inline-block;
        }

        .actions-cell {
            text-align: center;
            width: 80px;
        }

        @media print {
            body { background: white; padding: 0; }
            .container, .tab-content { box-shadow: none; padding: 0; max-width: 100%; display: block !important; }
            .tabs, .toolbar, .filter-row, .report-box, .actions-cell, th:last-child, td:last-child, #statusNuvem { display: none !important; }
            [contenteditable="true"] { background-color: transparent !important; border: none !important; }
            table, th, td { border: 1px solid #000; color: #000; }
            th { background-color: #e2e8f0 !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📋 Notas Registradas</h1>
    <div id="statusNuvem">Conectando ao Firebase...</div>

    <div class="tabs">
        <button class="tab-btn active" onclick="mudarAba('notas')">📝 Notas e Registros</button>
        <button class="tab-btn" onclick="mudarAba('dashboard')">📊 Dashboard</button>
        <button class="tab-btn" onclick="mudarAba('relatorio')">🖨️ Relatório Mensal</button>
    </div>

    <div id="aba-notas" class="tab-content active">
        <div class="toolbar">
            <div class="toolbar-group">
                <button class="btn-success" onclick="adicionarLinha()">➕ Nova Nota</button>
            </div>
        </div>

        <div class="filter-row">
            <div style="font-weight: 600; color: var(--primary-color);">🔍 Filtros:</div>
            <div><input type="text" id="filtroNota" placeholder="Nº da Nota..." oninput="renderizarTabela()"></div>
            <div><input type="text" id="filtroFornecedor" placeholder="Fornecedor..." oninput="renderizarTabela()"></div>
            <div><input type="text" id="filtroDescricao" placeholder="Descrição..." oninput="renderizarTabela()"></div>
            <div><input type="month" id="filtroMes" onchange="renderizarTabela()"></div>
            <button onclick="limparFiltros()" style="background-color: #64748b;">Limpar</button>
        </div>

        <div class="table-responsive">
            <table id="tabelaNotas">
                <thead>
                    <tr>
                        <th>Número da Nota</th>
                        <th>Fornecedor</th>
                        <th>Descrição do Item</th>
                        <th>Quantidade</th>
                        <th>Dia Recebido</th>
                        <th>Responsável</th>
                        <th class="actions-cell">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr><td colspan="7" style="text-align: center; color: #64748b; padding: 20px;">Carregando dados da nuvem...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="aba-dashboard" class="tab-content">
        <h2>Painel de Indicadores</h2>
        <div class="dashboard">
            <div class="card"><h3>Total de Registros</h3><p id="statTotalNotas">0</p></div>
            <div class="card"><h3>Quantidade Total</h3><p id="statSomaQtd">0</p></div>
        </div>
    </div>

    <div id="aba-relatorio" class="tab-content">
        <h2>Gerador de Relatório Mensal</h2>
        <div class="report-box">
            <label style="font-weight: 500; display: block; margin-bottom: 8px;">Selecione o Mês:</label>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="month" id="mesRelatorio" style="padding: 10px; font-size: 15px;">
                <button class="btn-warning" onclick="imprimirRelatorioMensal()">🖨️ Imprimir</button>
            </div>
        </div>
    </div>
</div>

<script>
    // COLE ABAIXO A SUA CONFIGURAÇÃO DO FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyB_stAqlEz81bKnAWk1LPqoU9v6W6TVuo8",
        authDomain: "seu-projeto.firebaseapp.com",
        projectId: "seu-projeto",
        storageBucket: "seu-projeto.appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let dadosNotas = [];

    document.addEventListener("DOMContentLoaded", function() {
        const statusEl = document.getElementById('statusNuvem');
        
        // Ordena os registros do mais recente para o mais antigo automaticamente no topo
        db.collection("notas").orderBy("criadoEm", "desc").onSnapshot((snapshot) => {
            dadosNotas = [];
            snapshot.forEach((doc) => {
                dadosNotas.push({ idDoc: doc.id, ...doc.data() });
            });
            
            statusEl.innerText = "☁️ Conectado à Nuvem (Sincronizado)";
            statusEl.style.background = "#d1fae5";
            statusEl.style.color = "#065f46";
            
            renderizarTabela();
            atualizarDashboard();
        }, (error) => {
            statusEl.innerText = "⚠️ Erro de conexão com o Firebase";
            statusEl.style.background = "#fee2e2";
            statusEl.style.color = "#991b1b";
            console.error("Erro: ", error);
        });
    });

    function mudarAba(abaId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (abaId === 'notas') {
            document.querySelector('.tabs button:nth-child(1)').classList.add('active');
            document.getElementById('aba-notas').classList.add('active');
        } else if (abaId === 'dashboard') {
            document.querySelector('.tabs button:nth-child(2)').classList.add('active');
            document.getElementById('aba-dashboard').classList.add('active');
        } else if (abaId === 'relatorio') {
            document.querySelector('.tabs button:nth-child(3)').classList.add('active');
            document.getElementById('aba-relatorio').classList.add('active');
        }
    }

    function adicionarLinha() {
        const hoje = new Date();
        const novaNota = {
            numero: "",
            fornecedor: "",
            descricao: "",
            quantidade: "1",
            data: `${String(hoje.getDate()).padStart(2, '0')}/${String(hoje.getMonth() + 1).padStart(2, '0')}/${hoje.getFullYear()}`,
            responsavel: "",
            criadoEm: firebase.firestore.FieldValue.serverTimestamp() // Usado para ordenar sempre no topo
        };
        db.collection("notas").add(novaNota);
    }

    function excluirLinha(idDoc) {
        if (confirm("Deseja excluir este registro?")) {
            db.collection("notas").doc(idDoc).delete();
        }
    }

    function atualizarCampo(idDoc, campo, valor) {
        db.collection("notas").doc(idDoc).update({ [campo]: valor });
    }

    function renderizarTabela() {
        const tbody = document.getElementById('corpoTabela');
        const pNota = document.getElementById('filtroNota').value.toLowerCase();
        const pForn = document.getElementById('filtroFornecedor').value.toLowerCase();
        const pDesc = document.getElementById('filtroDescricao').value.toLowerCase();
        const fMes = document.getElementById('filtroMes').value;
        
        tbody.innerHTML = '';

        let filtrados = dadosNotas.filter(item => {
            const mN = (item.numero || '').toLowerCase().includes(pNota);
            const mF = (item.fornecedor || '').toLowerCase().includes(pForn);
            const mD = (item.descricao || '').toLowerCase().includes(pDesc);
            let mMes = true;
            if (fMes && item.data && item.data.includes('/')) {
                const p = item.data.split('/');
                if (p.length === 3) mMes = (`${p[2]}-${p[1]}` === fMes);
            }
            return mN && mF && mD && mMes;
        });

        if (filtrados.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #64748b; padding: 20px;">Nenhum registro encontrado.</td></tr>`;
            return;
        }

        filtrados.forEach((item) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><div contenteditable="true" onblur="atualizarCampo('${item.idDoc}', 'numero', this.innerText)">${item.numero || ''}</div></td>
                <td><div contenteditable="true" onblur="atualizarCampo('${item.idDoc}', 'fornecedor', this.innerText)">${item.fornecedor || ''}</div></td>
                <td><div contenteditable="true" onblur="atualizarCampopar('${item.idDoc}', 'descricao', this.innerText)" onblur="atualizarCampo('${item.idDoc}', 'descricao', this.innerText)">${item.descricao || ''}</div></td>
                <td><div contenteditable="true" onblur="atualizarCampo('${item.idDoc}', 'quantidade', this.innerText)">${item.quantidade || ''}</div></td>
                <td><div contenteditable="true" onblur="atualizarCampo('${item.idDoc}', 'data', this.innerText)">${item.data || ''}</div></td>
                <td><div contenteditable="true" onblur="atualizarCampo('${item.idDoc}', 'responsavel', this.innerText)">${item.responsavel || ''}</div></td>
                <td class="actions-cell">
                    <button class="btn-danger" style="padding: 5px 10px; font-size: 12px;" onclick="excluirLinha('${item.idDoc}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function limparFiltros() {
        document.getElementById('filtroNota').value = '';
        document.getElementById('filtroFornecedor').value = '';
        document.getElementById('filtroDescricao').value = '';
        document.getElementById('filtroMes').value = '';
        renderizarTabela();
    }

    function atualizarDashboard() {
        document.getElementById('statTotalNotas').innerText = dadosNotas.length;
        let somaQtd = dadosNotas.reduce((acc, curr) => acc + (parseFloat(curr.quantidade) || 0), 0);
        document.getElementById('statSomaQtd').innerText = somaQtd;
    }

    function imprimirRelatorioMensal() {
        const mesVal = document.getElementById('mesRelatorio').value;
        if (!mesVal) { alert("Selecione o mês!"); return; }
        document.getElementById('filtroMes').value = mesVal;
        renderizarTabela();
        mudarAba('notas');
        setTimeout(() => window.print(), 300);
    }
</script>

</body>
</html>
